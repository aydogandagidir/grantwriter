name: api-ci

# Runs on every PR + every push to main. Three parallel jobs (lint,
# typecheck, test) so the slowest gates the whole run, not the sum.
#
# Concurrency: cancel in-progress runs of the same ref so a fast
# follow-up commit doesn't pile on top of an obsolete pipeline.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/supabase/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/supabase/**"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: poetry install
        run: poetry install --no-interaction --no-root
      - name: ruff check
        run: poetry run ruff check .

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: poetry install
        run: poetry install --no-interaction --no-root
      - name: mypy --strict
        run: poetry run mypy src

  test:
    name: Pytest (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      # pgvector image — Bluedev's local docker-compose uses the same
      # tag, so dev and CI agree on extension availability.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bluedev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bluedev_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bluedev_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: poetry install
        run: poetry install --no-interaction --no-root
      - name: Apply migrations to test DB
        # apply_migrations.sh runs auth_stub + every migration in lexical
        # order. Strict mode aborts on first error so a CI run never
        # silently masks a migration regression.
        run: bash scripts/apply_migrations.sh "$DATABASE_URL" --strict

      # Two pytest invocations because one specific test (the SSE 503
      # guard in test_generate_endpoint.py) ASSERTS that REDIS_URL is
      # unset. We deselect it here, then re-run that single test with
      # REDIS_URL cleared.
      - name: pytest (Redis-on path)
        run: |
          poetry run pytest -v \
            --deselect tests/api/test_generate_endpoint.py::test_stream_returns_503_when_redis_not_configured

      - name: pytest (Redis-unset stream guard)
        env:
          REDIS_URL: ""
        run: |
          poetry run pytest -v \
            tests/api/test_generate_endpoint.py::test_stream_returns_503_when_redis_not_configured
