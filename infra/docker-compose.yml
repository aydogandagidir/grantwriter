services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bluedev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluedev
    ports:
      - "5432:5432"
    volumes:
      - bluedev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bluedev-redis
    ports:
      - "6379:6379"
    volumes:
      - bluedev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  bluedev_pg_data:
  bluedev_redis_data:
