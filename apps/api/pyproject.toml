[tool.poetry]
name = "bluedev-grantwriter-api"
version = "0.1.0"
description = "Bluedev GrantWriter — FastAPI backend (agents, RAG, citations, exports)"
authors = ["Bluedev <hello@bluedev.io>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
asyncpg = "^0.30.0"
pgvector = "^0.3.6"
openai = "^1.54.0"
anthropic = "^0.39.0"
httpx = "^0.27.0"
tenacity = "^9.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
structlog = "^24.4.0"
pandas = "^2.2.3"
tqdm = "^4.66.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
faker = "^30.0.0"
asgi-lifespan = "^2.1.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
types-python-jose = "^3.3.4"
types-tqdm = "^4.66.0"
pandas-stubs = "^2.2.3"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────────────────────────
# Ruff — formatter + linter (CLAUDE.md mandate)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "ARG", # flake8-unused-arguments
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line-too-long — formatter handles this
  "PLR0913", # too-many-arguments — FastAPI dep injection
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004", "PLR0913", "S101"]
"scripts/**/*.py" = ["PLR0913", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ─────────────────────────────────────────────
# Mypy — strict type checking (CLAUDE.md mandate)
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pgvector.*", "tqdm.*", "asgi_lifespan.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: requires a live database connection",
]
