[tool.poetry]
name = "bluedev-grantwriter-api"
version = "0.1.0"
description = "Bluedev GrantWriter — FastAPI backend (agents, RAG, citations, exports)"
authors = ["Bluedev <hello@bluedev.io>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = { extras = ["email"], version = "^2.9" }
pydantic-settings = "^2.6"
asyncpg = "^0.30"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
anthropic = "^0.39"
openai = "^1.54"
httpx = "^0.27"
celery = { extras = ["redis"], version = "^5.4" }
redis = "^5.2"
pyjwt = { extras = ["crypto"], version = "^2.10" }
python-docx = "^1.1"
tiktoken = "^0.8"
rapidfuzz = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
mypy = "^1.13"

# Optional — installed via `poetry install --with alembic`. Production uses
# Supabase CLI for migrations; alembic stays available as a dev escape-hatch.
[tool.poetry.group.alembic]
optional = true

[tool.poetry.group.alembic.dependencies]
alembic = "^1.13"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────────────────────────
# Ruff — formatter + linter (CLAUDE.md mandate)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "ARG", # flake8-unused-arguments
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line-too-long — formatter handles this
  "PLR0913", # too-many-arguments — FastAPI dep injection
  "RUF001", # ambiguous unicode — bilingual TR/EN product, Turkish chars expected
  "RUF002", # ambiguous unicode in docstring — same reason
  "RUF003", # ambiguous unicode in comment — same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ─────────────────────────────────────────────
# Mypy — strict type checking (CLAUDE.md mandate)
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# asyncpg ships no py.typed marker as of 0.30.x — turn off the
# missing-stubs warning for it project-wide.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
